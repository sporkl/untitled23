<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Untitled 23</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="custom.css">
  <!-- <link rel="icon" type="image/png" href="static/favicon.png"> -->
	<script type="text/javascript" src="tone.js"></script>
	<script type="text/javascript" src="untitled23_client.js"></script>
</head>
<body>
  <div class="container">
		<br>
		<div id="modal" class="card is-full-width">
			<p>Please disable notifactions on your device. Then, unmute and increase the volume. Press the button below to start.</p>
			<footer class="is-center">
				<button class="button primary" onclick="startAudio()">Start</button>
			</footer>
		</div>
		<div id="interface" class="card" style="display: none;">
			<h2 id="zoom" class="is-center is-marginless">Zoom: 3.0</h2>
			<br>
			<div class="grouped is-center">
				<button class="button primary" onclick="sendIncrZoom()"><h3 class="is-marginless">+</h3></a>
				<button class="button primary" onclick="sendDecrZoom()"><h3 class="is-marginless">-</h3></a>
			</div>
			<br>
			<h2 id="start_pos" class="is-center is-marginless">Start: 0.000</h2>
			<br>
			<div class="grouped is-center">
				<button class="button primary" onclick="sendIncrStart()"><h3 class="is-marginless">+</h3></a>
				<button class="button primary" onclick="sendDecrStart()"><h3 class="is-marginless">-</h3></a>
			</div>
			<br>
			<h2 id="end_pos" class="is-center is-marginless">End: 1.000</h2>
			<br>
			<div class="grouped is-center">
				<button class="button primary" onclick="sendIncrEnd()"><h3 class="is-marginless">+</h3></a>
				<button class="button primary" onclick="sendDecrEnd()"><h3 class="is-marginless">-</h3></a>
			</div>
		</div>
  </div>
</body>
</html>
